# Render's free plan sleeps a service after 15 idle minutes. This free scheduled ping keeps it awake.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 --retry 3 --retry-delay 20 https://insightforge-web-6jlk.onrender.com/api/health > /dev/null
