# One-click deploy on Render's free plan: https://render.com/deploy
# One service runs both the web app and the API (see Dockerfile), so it fits the free plan's
# monthly hours while kept awake by .github/workflows/keep-awake.yml.
# No secrets live here. Set optional keys (LLM_API_KEY etc.) in the Render dashboard.
services:
  - type: web
    name: insightforge-web
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: none
      - key: COOKIE_SECURE
        value: "1"
      - key: SANDBOX_MEMORY_MB
        value: "256"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: DATABASE_URL
        sync: false   # paste a free Neon/Supabase Postgres URL to keep accounts across restarts
      - key: ADMIN_EMAILS
        sync: false
