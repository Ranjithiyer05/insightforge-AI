# One-click deploy on Render's free plan: https://render.com/deploy
# No secrets live here. Set optional keys (LLM_API_KEY etc.) in the Render dashboard.
services:
  - type: web
    name: insightforge-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: none
      - key: COOKIE_SECURE
        value: "1"
      - key: SANDBOX_MEMORY_MB
        value: "384"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: DATABASE_URL
        sync: false   # paste a free Neon/Supabase Postgres URL to keep accounts across restarts
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: insightforge-web
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        sync: false   # the API service URL, e.g. https://insightforge-api.onrender.com
